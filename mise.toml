[tools]
node = "24"
pnpm = "latest"
"npm:@dotenvx/dotenvx" = "latest"

[tasks.default]
description = "Run the Tauri app with secrets loaded from .env via dotenvx"
run = "dotenvx run -- pnpm tauri dev"

[tasks.dev]
description = "Run the Tauri app with secrets loaded from .env via dotenvx"
run = "dotenvx run -- pnpm tauri dev"

[tasks.frontend]
description = "Run the Vite frontend with .env loaded via dotenvx"
run = "dotenvx run -- pnpm dev"

[tasks.build]
description = "Build the Tauri app with .env loaded via dotenvx"
run = "dotenvx run -- pnpm tauri build"

[tasks.frontend-build]
description = "Build the frontend with .env loaded via dotenvx"
run = "dotenvx run -- pnpm build"

[tasks.test]
description = "Run frontend tests with .env loaded via dotenvx"
run = "dotenvx run -- pnpm test"

[tasks.cargo-check]
description = "Run Rust cargo check with .env loaded via dotenvx"
run = "dotenvx run -f ../.env -- cargo check"
dir = "src-tauri"

[tasks.mobile-test]
description = "Run Lexi Review Android unit tests"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-mobile-gradle.ps1 :app:testDebugUnitTest"

[tasks.mobile-build]
description = "Build the Lexi Review Android debug APK"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-mobile-gradle.ps1 :app:assembleDebug"

[tasks.mobile-install]
description = "Install the Lexi Review Android debug APK on the connected device"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-mobile-gradle.ps1 :app:installDebug"

[tasks.mobile-adb-devices]
description = "List Android devices visible to adb"
run = "adb devices -l"

[tasks.mobile-adb-pair]
description = "Pair an Android device for wireless debugging: mise run mobile-adb-pair ip:port"
run = "adb pair"

[tasks.mobile-adb-connect]
description = "Connect to a paired Android device for wireless debugging: mise run mobile-adb-connect ip:port"
run = "adb connect"
